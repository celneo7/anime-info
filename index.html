<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime Info</title>
  <meta name="description" content="Browse anime and manga from AniList, with each anime matched to its manga.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><a href="#/" class="brand"><strong>Anime Info</strong></a></li>
        <li><a href="#/anime" data-nav="anime">Anime</a></li>
        <li><a href="#/manga" data-nav="manga">Manga</a></li>
        <li><a href="#/charts" data-nav="charts">Charts</a></li>
      </ul>
      <ul class="search-wrap">
        <li>
          <form id="search-form" role="search">
            <select id="search-type" aria-label="Search in">
              <option value="anime">Anime</option>
              <option value="manga">Manga</option>
            </select>
            <input id="search-input" type="search" name="q" placeholder="Search…" aria-label="Search" required>
            <input type="submit" value="Search">
          </form>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container" id="app" aria-live="polite"></main>

  <footer class="container">
    <small>
      Data from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>,
      theme songs from <a href="https://animethemes.moe" target="_blank" rel="noopener">AnimeThemes</a>,
      charts from the iTunes Store.
      Not affiliated with or endorsed by any of them, or by MangaDex.
    </small>
  </footer>

  <script type="module" src="app.js?v=4"></script>
</body>
</html>
